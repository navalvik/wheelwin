name: Pin Testnet TON SDK lockfile
on:
  pull_request:
    paths:
      - server/package.json
      - .github/workflows/pin-testnet-ton-sdk.yml
jobs:
  lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/testnet-refund-prebroadcast-durability-20261026'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve and pin lockfile
        working-directory: server
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile only to isolated PR branch
        run: |
          if ! git diff --quiet -- server/package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add server/package-lock.json
            git commit -m "build(refund): lock pinned TON SDK dependencies"
            git push origin HEAD:fix/testnet-refund-prebroadcast-durability-20261026
          fi
