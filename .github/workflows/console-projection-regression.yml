name: Console Projection Regression

on:
  pull_request:
    paths:
      - "server/console/DeveloperConsoleGateway.js"
      - "server/console/consoleProtocol.js"
      - "server/tests/developerConsoleProjectionIsolation.test.js"
      - "server/package.json"
      - "server/package-lock.json"
      - ".github/workflows/console-projection-regression.yml"
  push:
    branches:
      - "fix/console-legacy-payment-projection-guard"
    paths:
      - "server/console/DeveloperConsoleGateway.js"
      - "server/console/consoleProtocol.js"
      - "server/tests/developerConsoleProjectionIsolation.test.js"
      - "server/package.json"
      - "server/package-lock.json"
      - ".github/workflows/console-projection-regression.yml"

permissions:
  contents: read

jobs:
  focused-console-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Check gateway syntax
        run: node --check server/console/DeveloperConsoleGateway.js

      - name: Check focused test syntax
        run: node --check server/tests/developerConsoleProjectionIsolation.test.js

      - name: Run focused console regression
        run: node tests/developerConsoleProjectionIsolation.test.js
        working-directory: server
