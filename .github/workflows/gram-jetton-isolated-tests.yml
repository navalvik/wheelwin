name: GRAM Jetton isolated safety tests

on:
  push:
    branches:
      - restore/testnet-64-wallet-page4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-gram-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Server GRAM policy, mapper, discovery and config tests
        working-directory: server
        run: |
          node --test tests/verifiedGramTransferPolicy.test.js tests/gramJettonMasterWalletBinding.test.js tests/gramJettonGetterStackDecoder.test.js tests/gramTestnetGetterSmoke.test.js tests/gramGetterBocStructure.test.js tests/toncenterGramJettonGetMethodsClient.test.js tests/gramJettonFinalityCorrelation.test.js tests/gramJettonReceiverFinalityCorrelation.test.js tests/toncenterGramTraceDiscovery.test.js tests/gramJettonTraceMessageLink.test.js tests/gramInternalTransferBody.test.js tests/verifiedGramIntentAdmission.test.js tests/gramJettonMasterConfig.test.js tests/gramJettonTransferCandidates.test.js tests/toncenterJettonTransfersClient.test.js
      - name: Active JSON store GRAM transaction replay and restart regression
        working-directory: server
        run: node --test tests/payment/gramJsonReplaySafety.test.js
      - name: Install server dependencies for SQLite storage regression
        working-directory: server
        run: npm ci --ignore-scripts=false --no-audit --no-fund
      - name: SQLite GRAM replay and runtime backend isolation
        working-directory: server
        run: node --test tests/payment/gramSqliteReplaySafety.test.js tests/payment/paymentRuntimeStorageBackend.test.js tests/payment/stageJsonPaymentIntentsToSqlite.test.js
      - name: Durable refund submission and restart double-send regression
        working-directory: server
        run: node tests/refundOutgoingExecution.test.js && node tests/refundLifecycle.test.js
      - name: Native Page4 authoritative status and reconnect regression
        working-directory: server
        run: node tests/payment/page4ReconnectPaymentRecovery.test.js
      - name: Client GRAM transfer encoding and preflight tests
        working-directory: client
        run: |
          node --test src/payment/gramJettonPayload.test.js src/payment/gramPaymentAuthorization.test.js src/payment/nativeGramTransfer.test.js src/payment/nativeGramWalletSubmission.test.js src/payment/tonConnectUIAdapter.test.js
      - name: Install client dependencies for React Page4 build
        working-directory: client
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile complete Vite client with TON Connect bootstrap
        working-directory: client
        run: npm run build
