name: Testnet three-player payment release gate
on:
  push:
    branches:
      - fix/testnet-payment-reconciliation-forensics
  pull_request:
    paths:
      - 'server/payment/**'
      - 'server/app.js'
      - 'server/tests/mainnetToncenterTestnetParity.test.js'
      - 'server/tests/mainnetTestnetRefundParity.test.js'
      - 'server/tests/mainnetTestnetIncomingReceiptParity.test.js'
      - 'server/tests/mainnetTestnetWalletPoolParity.test.js'
      - 'server/tests/mainnetSharedPaymentRuntimePreparation.test.js'
      - 'server/tests/mainnetTestnetOutgoingParity.test.js'
      - 'server/tests/mainnetNativeRoomPayoutParity.test.js'
      - 'server/tests/mainnetCrossRoomSeqnoRegression.test.js'
      - 'server/tests/mainnetSharedRefundPayoutOutbox.test.js'
      - 'server/tests/mainnetReadOnlyFinancialRecoveryParity.test.js'
      - 'server/tests/mainnetOfflineFullFinanceReadiness.test.js'
      - 'server/tests/mainnetRefundLifecycleCapabilityParity.test.js'
      - 'server/tests/mainnetWinnerPayoutLifecycleParity.test.js'
      - 'server/tests/mainnetFinancialReleaseReadinessGate.test.js'
      - 'server/forensic/**'
      - 'server/history/**'
      - 'server/socket/**'
      - 'client/src/pages/Page4Payment.jsx'
      - 'client/src/payment/**'
      - 'server/tests/paymentHistoricalCrossRoom.test.js'
      - 'server/tests/paymentObservationWithoutAcknowledgement.test.js'
      - 'server/tests/paymentReconciliationDefects.test.js'
      - 'server/tests/paymentThreePlayerGate.test.js'
      - '.github/workflows/testnet-three-player-release-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Validate changed financial modules
        run: |
          node --check app.js
          node --check payment/runtime/HistoricalIncomingReceiptReconciler.js
          node --check payment/WalletPoolRegistry.js
          node --check socket/RoomLobbyBridge.js
          node --check forensic/ForensicArchiveService.js
          node --check forensic/R2ForensicArchiveUploader.js
      - name: Deterministic payment and 3/3 gate regressions
        run: node --test tests/payment/*.test.js tests/paymentReconciliationDefects.test.js tests/paymentHistoricalCrossRoom.test.js tests/paymentObservationWithoutAcknowledgement.test.js tests/paymentThreePlayerGate.test.js tests/paymentLedgerPayout.phase4.test.js tests/restoredR2ArchiveRoomClose.test.js
  toncenter_network_parity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Shared Testnet and Mainnet Toncenter payment confirmation regressions
        run: node --test tests/mainnetToncenterTestnetParity.test.js tests/mainnetTestnetRefundParity.test.js tests/mainnetTestnetIncomingReceiptParity.test.js tests/mainnetTestnetWalletPoolParity.test.js tests/mainnetSharedPaymentRuntimePreparation.test.js tests/mainnetTestnetOutgoingParity.test.js tests/mainnetNativeRoomPayoutParity.test.js tests/mainnetCrossRoomSeqnoRegression.test.js tests/mainnetSharedRefundPayoutOutbox.test.js tests/mainnetReadOnlyFinancialRecoveryParity.test.js tests/mainnetOfflineFullFinanceReadiness.test.js tests/mainnetRefundLifecycleCapabilityParity.test.js tests/mainnetWinnerPayoutLifecycleParity.test.js tests/mainnetFinancialReleaseReadinessGate.test.js tests/payment/testnetPendingRefundReconciler.test.js tests/payment/testnetPendingPayoutReconciler.test.js tests/payment/nativeRoomRefundIntegration.test.js tests/payment/legacyRoomWalletV4.test.js tests/payment/durablePayoutBroadcast.test.js tests/payment/testnetNativeRoomPayoutTransport.test.js tests/payment/testnetWinnerPayoutCoordinator.test.js tests/payment/incomingReceiptAccounting.test.js tests/refundLifecycle.test.js tests/page4IndexedFinality.test.js

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Verify UI unit tests
        run: node scripts/run-tests.js
      - name: Verify production build
        run: npm run build
