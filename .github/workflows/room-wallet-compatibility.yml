name: Room wallet compatibility regression
on:
  pull_request:
    paths:
      - "server/payment/refund/LegacyRoomWalletIdentityBridge.js"
      - "server/payment/roomWallet/RoomWalletAdapter.js"
      - "server/payment/roomWallet/RoomWalletSettlementAdapter.js"
      - "server/payment/roomWallet/RoomWalletRegistry.js"
      - "server/payment/roomWallet/roomWalletTerminalRecoveryChain.js"
      - "server/models/TonWalletAddress.js"
      - "server/payment/refund/RefundLifecycleCoordinator.js"
      - "server/tests/refundOutgoingExecution.test.js"
      - "server/tests/refundLifecycle.test.js"
      - "server/payment/roomWallet/RoomWalletFinancialPolicy.js"
      - "server/package.json"
      - "server/package-lock.json"
      - "server/tests/legacyRoomWalletIdentityBridge.test.js"
      - "server/tests/restoredRoomWalletAdapterIntegration.test.js"
      - "server/tests/restoredRoomWalletRefundOffline.test.js"
      - "server/payment/refund/LegacyRefundPlanningBridge.js"
      - "server/tests/legacyRefundPlanningBridge.test.js"
      - "server/tests/restoredPositiveRefundPlan.test.js"
      - "server/payment/refund/RestoredRoomWalletSettlementFactory.js"
      - "server/payment/runtime/PaymentRuntimeFactory.js"
      - "server/tests/restoredSettlementFactory.test.js"
      - ".github/workflows/room-wallet-compatibility.yml"
  workflow_dispatch:
jobs:
  compatibility:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --ignore-scripts
      - run: node --check payment/roomWallet/RoomWalletAdapter.js
      - run: node --check payment/roomWallet/RoomWalletFinancialPolicy.js
      - run: node -e "import('./payment/roomWallet/RoomWalletSettlementAdapter.js').then(() => console.log('Legacy settlement/refund import OK'))"
      - run: node -e "import('./payment/roomWallet/RoomWalletAdapter.js').then(() => console.log('Legacy WalletV4 transport import OK'))"
      - run: node --test tests/refundOutgoingExecution.test.js tests/refundLifecycle.test.js tests/payment/paymentRuntimeIntegration.test.js
      - run: node --test tests/legacyRoomWalletIdentityBridge.test.js tests/restoredRoomWalletAdapterIntegration.test.js tests/restoredRoomWalletRefundOffline.test.js tests/legacyRefundPlanningBridge.test.js tests/restoredPositiveRefundPlan.test.js tests/restoredSettlementFactory.test.js
      - run: node --check payment/runtime/PaymentRuntimeFactory.js
      - run: node -e "import('./payment/runtime/PaymentRuntimeFactory.js').then(() => console.log('Payment runtime import OK'))"
