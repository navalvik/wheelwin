name: Testnet refund prebroadcast durability
on:
  pull_request:
    paths:
      - "server/payment/refund/RefundLifecycleCoordinator.js"
      - "server/payment/refund/TestnetOutgoingRefundProvider.js"
      - "server/payment/runtime/PaymentRuntimeFactory.js"
      - "server/tests/refundOutgoingExecution.test.js"
      - "server/tests/payment/refundProductionWiring.contract.test.js"
      - ".github/workflows/testnet-refund-prebroadcast.yml"
  workflow_dispatch:
jobs:
  refund-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --ignore-scripts
      - run: node --test tests/refundOutgoingExecution.test.js tests/payment/refundProductionWiring.contract.test.js
