name: Server Tests

on:
  push:
    branches:
      - "feat/archive-aligned-room-wallet-payments"
    paths:
      - "server/**"
      - ".github/workflows/server-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/server-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-tests:
    name: Node server test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install locked server dependencies
        working-directory: server
        shell: bash
        run: |
          set -o pipefail
          npm ci --no-audit --no-fund 2>&1 | tee ../server-npm-ci.log
      - name: Run complete server test suite
        working-directory: server
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee ../server-npm-test.log
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            server-npm-ci.log
            server-npm-test.log
          if-no-files-found: warn
          retention-days: 7
