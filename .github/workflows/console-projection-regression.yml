name: Console Projection Regression

on:
  pull_request:
    paths:
      - "server/console/DeveloperConsoleGateway.js"
      - "server/console/consoleProtocol.js"
      - "server/tests/developerConsoleProjectionIsolation.test.js"
      - ".github/workflows/console-projection-regression.yml"
  push:
    branches:
      - "fix/console-legacy-payment-projection-guard"
    paths:
      - "server/console/DeveloperConsoleGateway.js"
      - "server/console/consoleProtocol.js"
      - "server/tests/developerConsoleProjectionIsolation.test.js"
      - ".github/workflows/console-projection-regression.yml"

permissions:
  contents: read

jobs:
  focused-console-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run focused checks and capture diagnostics
        id: checks
        shell: bash
        run: |
          set +e
          : > console-regression-diagnostics.txt
          node --version >> console-regression-diagnostics.txt 2>&1
          node --check server/console/DeveloperConsoleGateway.js >> console-regression-diagnostics.txt 2>&1
          gateway_status=$?
          node --check server/tests/developerConsoleProjectionIsolation.test.js >> console-regression-diagnostics.txt 2>&1
          syntax_status=$?
          (cd server && node tests/developerConsoleProjectionIsolation.test.js) >> console-regression-diagnostics.txt 2>&1
          test_status=$?
          {
            echo "gateway_syntax_exit=$gateway_status"
            echo "test_syntax_exit=$syntax_status"
            echo "focused_test_exit=$test_status"
          } >> console-regression-diagnostics.txt
          if [ "$gateway_status" -eq 0 ] && [ "$syntax_status" -eq 0 ] && [ "$test_status" -eq 0 ]; then
            echo "result=passed" >> console-regression-diagnostics.txt
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "result=failed" >> console-regression-diagnostics.txt
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload regression diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-regression-diagnostics
          path: console-regression-diagnostics.txt
          if-no-files-found: error
      - name: Set final status
        if: steps.checks.outputs.failed == 'true'
        run: |
          cat console-regression-diagnostics.txt
          exit 1
