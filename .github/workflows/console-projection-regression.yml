name: Console Projection Regression

on:
  pull_request:
    paths:
      - "server/console/DeveloperConsoleGateway.js"
      - "server/console/consoleProtocol.js"
      - "server/tests/developerConsoleProjectionIsolation.test.js"
      - ".github/workflows/console-projection-regression.yml"
  push:
    branches:
      - "fix/console-legacy-payment-projection-guard"
    paths:
      - "server/console/DeveloperConsoleGateway.js"
      - "server/console/consoleProtocol.js"
      - "server/tests/developerConsoleProjectionIsolation.test.js"
      - ".github/workflows/console-projection-regression.yml"

permissions:
  contents: read

jobs:
  runner-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Record runner and repository access diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set +e
          {
            echo "=== Runner ==="
            uname -a
            echo "=== Node and npm ==="
            node --version
            npm --version
            echo "=== GitHub repository API ==="
            curl -sS -o /tmp/repo.json -w "repository_api_http=%{http_code}\n" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GH_REPOSITORY"
            head -c 400 /tmp/repo.json
            echo
            echo "=== Current commit API ==="
            curl -sS -o /tmp/commit.json -w "commit_api_http=%{http_code}\n" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GH_REPOSITORY/commits/$GH_SHA"
            head -c 400 /tmp/commit.json
            echo
          } 2>&1 | tee runner-diagnostics.txt
          exit ${PIPESTATUS[0]}
      - name: Upload runner diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner-diagnostics
          path: runner-diagnostics.txt
          if-no-files-found: warn

  focused-console-regression:
    needs: runner-diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify gateway syntax
        run: node --check server/console/DeveloperConsoleGateway.js
      - name: Verify regression test syntax
        run: node --check server/tests/developerConsoleProjectionIsolation.test.js
      - name: Run focused regression
        working-directory: server
        run: node tests/developerConsoleProjectionIsolation.test.js
