name: GRAM Jetton isolated safety tests

on:
  push:
    branches:
      - restore/testnet-64-wallet-page4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-gram-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Server GRAM policy, mapper, discovery and config tests
        working-directory: server
        run: |
          node --test tests/verifiedGramTransferPolicy.test.js tests/verifiedGramIntentAdmission.test.js tests/gramJettonMasterConfig.test.js tests/gramJettonTransferCandidates.test.js tests/toncenterJettonTransfersClient.test.js
      - name: Active JSON store GRAM transaction replay and restart regression
        working-directory: server
        run: node --test tests/payment/gramJsonReplaySafety.test.js
      - name: Install server dependencies for SQLite storage regression
        working-directory: server
        run: npm ci --ignore-scripts=false --no-audit --no-fund
      - name: SQLite GRAM replay and runtime backend isolation
        working-directory: server
        run: node --test tests/payment/gramSqliteReplaySafety.test.js tests/payment/paymentRuntimeStorageBackend.test.js
      - name: Client GRAM transfer encoding and preflight tests
        working-directory: client
        run: |
          node --test src/payment/gramJettonPayload.test.js src/payment/gramPaymentAuthorization.test.js
