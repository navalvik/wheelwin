name: Room Wallet refund correlation

on:
  pull_request:
    paths:
      - "server/gameplay/PaymentSessionManager.js"
      - "server/gameplay/partialPaymentEscrowUnwind.js"
      - "server/payment/roomWallet/RoomWalletSettlementAdapter.js"
      - "server/payment/roomWallet/roomWalletTerminalRecoveryChain.js"
      - "server/tests/roomWalletRefundCorrelation.test.js"
      - "server/tests/roomWalletSettlementAdapter.test.js"
      - "server/package.json"
      - "server/package-lock.json"

jobs:
  refund-correlation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        run: npm ci
        working-directory: server
      - name: Test refund correlation safeguards
        run: node --test tests/roomWalletRefundCorrelation.test.js tests/roomWalletSettlementAdapter.test.js
        working-directory: server
