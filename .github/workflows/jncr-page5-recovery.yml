name: JNcR authoritative Page5 recovery regression

on:
  push:
    branches:
      - fix/jncr-recovery-module-dispatch-20261101
  pull_request:
    paths:
      - "client/src/game/sessionRecovery/**"
      - "client/src/context/PhysicsContext.jsx"
      - "client/src/game/physics/recoveryFrameDelivery.test.js"
      - ".github/workflows/jncr-page5-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-regression:
    name: Client unit tests and production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
