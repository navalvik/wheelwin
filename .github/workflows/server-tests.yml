name: Server Tests

on:
  push:
    branches:
      - "feat/archive-aligned-room-wallet-payments"
    paths:
      - "server/**"
      - ".github/workflows/server-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "server/**"
      - ".github/workflows/server-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-tests:
    name: Node server test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install locked server dependencies
        working-directory: server
        run: npm ci
      - name: Run complete server test suite
        working-directory: server
        run: npm test
