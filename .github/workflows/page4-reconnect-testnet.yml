name: Testnet Page4 reconnect regression
on:
  push:
    branches:
      - restore/page3-wallet-to-page4-testnet
      - fix/testnet-page4-matched-not-payable-20261028
    paths:
      - "client/src/pages/Page4Payment.jsx"
      - "client/src/pages/page4PaymentStatusRecovery.js"
      - "client/src/tests/page4PaymentStatusRecovery.test.js"
      - "client/src/payment/buildRoomWalletTonConnectRequest.js"
      - "client/tests/roomWalletTonConnectRequest.test.js"
      - "server/socket/RoomLobbyBridge.js"
      - "server/tests/payment/restoreTestnetPage3Requirements.test.js"
      - "server/payment/roomWallet/RoomWalletAdapter.js"
      - "server/payment/roomWallet/TestnetNativeTonService.js"
      - "server/tests/payment/legacyRoomWalletV4.test.js"
      - "server/tests/paymentCore.phase1.test.js"
      - "server/config/rooms.js"
      - "server/payment/RoomPaymentConstants.js"
      - ".github/workflows/page4-reconnect-testnet.yml"
  workflow_dispatch:
jobs:
  client-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --ignore-scripts
      - run: node --import ./scripts/register.js src/tests/page4PaymentStatusRecovery.test.js
      - run: node --test tests/roomWalletTonConnectRequest.test.js
      - run: npm run build

  wallet-v4-seqno:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --ignore-scripts
      - run: node --check payment/roomWallet/RoomWalletAdapter.js
      - run: node --check payment/roomWallet/TestnetNativeTonService.js
      - run: node tests/paymentCore.phase1.test.js
      - run: node --test tests/payment/restoreTestnetPage3Requirements.test.js
      - run: node --test tests/payment/legacyRoomWalletV4.test.js tests/payment/nativeRoomRefundIntegration.test.js tests/payment/testnetNativeRoomPayoutTransport.test.js
