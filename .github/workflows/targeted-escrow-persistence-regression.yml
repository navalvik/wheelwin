name: Targeted Escrow Persistence Regression

on:
  push:
    branches:
      - recovery/escrow-mode-fix-production-20261009

permissions:
  contents: read

jobs:
  escrow-persistence-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Test verified legacy checksum repair and fail-closed behavior
        working-directory: server
        run: node --test tests/tonFinancialPersistence.legacyEscrowModeRepair.test.js
      - name: Test new settlement writes do not omit gameEscrowMode
        working-directory: server
        run: >-
          node --test
          --test-name-pattern="Room-Wallet settlement persists a DEFINED gameEscrowMode that survives restore"
          tests/roomWalletSettlement.r18s83.retryable.test.js
