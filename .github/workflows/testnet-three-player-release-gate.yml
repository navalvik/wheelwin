name: Testnet three-player payment release gate
on:
  push:
    branches:
      - fix/testnet-payment-reconciliation-forensics
  pull_request:
    paths:
      - 'server/payment/**'
      - 'server/mainnet/**'
      - 'server/tests/mainnetReadOnlyPreflight.test.js'
      - 'server/tests/mainnetRoomIncomingObserver.test.js'
      - 'server/tests/mainnetIndexedReceiptFinality.test.js'
      - 'server/tests/mainnetPaymentCandidateJournal.test.js'
      - 'server/tests/mainnetTonapiReadOnlyCorroboration.test.js'
      - 'server/tests/mainnetLiteTransactionBocInspector.test.js'
      - 'server/tests/mainnetMasterchainHeaderCheckpoint.test.js'
      - 'server/tests/mainnetSharedRefundPayoutParity.test.js'
      - 'server/tests/mainnetSharedRuntimeReadOnlyAdapter.test.js'
      - 'server/forensic/**'
      - 'server/history/**'
      - 'server/socket/**'
      - 'client/src/pages/Page4Payment.jsx'
      - 'client/src/payment/**'
      - 'server/tests/paymentHistoricalCrossRoom.test.js'
      - 'server/tests/paymentObservationWithoutAcknowledgement.test.js'
      - 'server/tests/paymentReconciliationDefects.test.js'
      - 'server/tests/paymentThreePlayerGate.test.js'
      - '.github/workflows/testnet-three-player-release-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Validate changed financial modules
        run: |
          node --check payment/runtime/HistoricalIncomingReceiptReconciler.js
          node --check payment/WalletPoolRegistry.js
          node --check socket/RoomLobbyBridge.js
          node --check forensic/ForensicArchiveService.js
          node --check forensic/R2ForensicArchiveUploader.js
      - name: Deterministic payment and 3/3 gate regressions
        run: node --test tests/payment/*.test.js tests/paymentReconciliationDefects.test.js tests/paymentHistoricalCrossRoom.test.js tests/paymentObservationWithoutAcknowledgement.test.js tests/paymentThreePlayerGate.test.js tests/paymentLedgerPayout.phase4.test.js tests/restoredR2ArchiveRoomClose.test.js
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - name: Verify UI unit tests
        run: node scripts/run-tests.js
      - name: Verify production build
        run: npm run build

  mainnet_read_only:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Mainnet isolation, active-room read-only receipts and Testnet compatibility
        run: node --test tests/mainnetReadOnlyPreflight.test.js tests/mainnetRoomIncomingObserver.test.js tests/mainnetIndexedReceiptFinality.test.js tests/mainnetPaymentCandidateJournal.test.js tests/mainnetTonapiReadOnlyCorroboration.test.js tests/mainnetLiteTransactionBocInspector.test.js tests/mainnetMasterchainHeaderCheckpoint.test.js tests/mainnetSharedRefundPayoutParity.test.js tests/mainnetSharedRuntimeReadOnlyAdapter.test.js tests/page4IndexedFinality.test.js tests/payment/legacyRoomWalletV4.test.js
